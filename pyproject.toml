[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cba-production"
version = "0.3.0"
description = "CBA production Tutor plugin and Open edX Django App Plugin"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
]

[project.entry-points."tutor.plugin.v1"]
cba-production = "cba_production.plugin"

[project.entry-points."lms.djangoapp"]
cba-recaptcha = "cba_production.recaptcha.apps:CbaRecaptchaConfig"
cba-learning-credits = "cba_production.learning_credits.apps:LearningCreditsConfig"

[project.entry-points."cms.djangoapp"]
cba-learning-credits = "cba_production.learning_credits.apps:LearningCreditsConfig"


[tool.setuptools.packages.find]
include = ["cba_production*"]

[tool.setuptools.package-data]
"cba_production.learning_credits" = ["templates/**/*.html", "static/**/*.js"]
