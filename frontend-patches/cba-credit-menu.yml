name: cba-credit-menu
version: 0.1.0
patches:
  mfe-dockerfile-post-npm-install-authoring: |
    # Verawood Settings menu: fail the build if the source no longer matches.
    RUN printf '%s' '' | base64 -d > /tmp/cba-credit-menu.patch && git apply --check /tmp/cba-credit-menu.patch && git apply /tmp/cba-credit-menu.patch
